apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: cloudnative-pg
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "n8n,media-flix,affine,vaultwarden,nbot,home-assistant,monitoring,paperless,linkwarden"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "n8n,media-flix,affine,vaultwarden,nbot,home-assistant,monitoring,paperless,linkwarden"
