controllers:
  media-qb:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      gluetun:
        image:
          repository: ghcr.io/qdm12/gluetun
          tag: v3.40.0
        env:
          VPN_SERVICE_PROVIDER: surfshark
          VPN_TYPE: wireguard
          SERVER_COUNTRIES: Netherlands
          FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.1.0/24
          FIREWALL_INPUT_PORTS: 80,50413
          DOT: "off"
        envFrom:
          - secretRef:
              name: media-qb-gluetun-secret
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
      app:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba

        env:
          TZ: Europe/Amsterdam
          QBT_WEBUI_PORT: &qbPort 80
          QBT_TORRENTING_PORT: &torrentPort 50413
          CROSS_SEED_ENABLED: false
          PUSHOVER_ENABLED: false
#        envFrom:
#          - secretRef:
#              name: qbittorrent-secret
        ports:
          - name: http
            containerPort: *qbPort
          - name: qbittorrent
            containerPort: *torrentPort
        probes:
          liveness:
            enabled: true
            port: *qbPort
          readiness:
            enabled: true
            port: *qbPort
          startup:
            enabled: true
            port: *qbPort
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [10000]
    seccompProfile: { type: RuntimeDefault }
  terminationGracePeriodSeconds: 300

service:
  app:
    controller: &qb-service media-qb
    ports:
      http:
        enabled: true
        protocol: TCP
        port: *qbPort
      qbittorrent:
        enabled: true
        port: *torrentPort
        protocol: TCP

persistence:
  dev-net-tun:
    type: hostPath
    hostPath: /dev/net/tun
    advancedMounts:
      media-qb:
        gluetun:
          - path: /dev/net/tun
  config:
    existingClaim: media-qb-config
    advancedMounts:
      media-qb:
        app:
          - path: /config
  tmp:
    type: emptyDir
    advancedMounts:
      media-qb:
        app:
          - path: /tmp
  media:
    existingClaim: media-storage
    advancedMounts:
      media-qb:
        app:
          - path: /media
#        subPath: downloads

rawResources:
  middleware:
    enabled: true
    forceRename: media-qb-default-headers
    manifest:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      spec:
        headers:
          browserXssFilter: false
          contentTypeNosniff: false
          forceSTSHeader: false
          stsIncludeSubdomains: false
          stsPreload: false
          stsSeconds: 15552000
          referrerPolicy: no-referrer
#          contentSecurityPolicy: "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:; frame-src 'self' https:; media-src 'self' https:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
#          customFrameOptionsValue: SAMEORIGIN
          customRequestHeaders:
            X-Forwarded-Proto: https
  ingress-route:
    enabled: true
    manifest:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.1.200
          kubernetes.io/ingress.class: traefik-external
      spec:
        entryPoints:
          - websecure
        routes:
          - match: Host(`media-qb.local.naguiar.dev`)
            kind: Rule
#            middlewares:
#              - name: media-qb-default-headers
            services:
              - name: *qb-service
                port: *qbPort
        tls:
          secretName: certificate-tls
