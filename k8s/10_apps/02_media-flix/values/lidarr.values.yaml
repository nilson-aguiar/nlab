controllers:
  lidarr:
    strategy: Recreate
    replicas: 1

    pod:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18
        env:
          INIT_POSTGRES_SUPER_PASS:
            valueFrom:
              secretKeyRef:
                name: postgres-superuser
                key: password
          INIT_POSTGRES_HOST: "postgres-rw.cloudnative-pg.svc.cluster.local"
        envFrom:
          - secretRef:
              name: lidarr-init
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/lidarr
          tag: latest
        env:
          LIDARR__APP__INSTANCENAME: Lidarr
          LIDARR__APP__THEME: dark
          LIDARR__AUTH__METHOD: External
          LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
          LIDARR__LOG__DBENABLED: "False"
          LIDARR__LOG__LEVEL: info
          LIDARR__SERVER__PORT: &lidarrPort 80
          LIDARR__UPDATE__BRANCH: master
          TZ: Europe/Amsterdam
          LIDARR__POSTGRES__PORT: "5432"
          LIDARR__POSTGRES__HOST: "postgres-rw.cloudnative-pg.svc.cluster.local"
        envFrom:
          - secretRef:
              name: lidarr-secret
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        ports:
          - name: http
            containerPort: *lidarrPort
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

persistence:
  config:
    enabled: true
    existingClaim: lidarr-config
  tmp:
    type: emptyDir
  media:
    existingClaim: media-storage
    globalMounts:
      - path: /media
service:
  app:
    controller: lidarr
    ports:
      http:
        port: *lidarrPort

rawResources:
  middleware:
    enabled: true
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    forceRename: lidarr-default-headers
    spec:
      spec:
        headers:
          browserXssFilter: true
          contentTypeNosniff: true
          forceSTSHeader: true
          stsIncludeSubdomains: true
          stsPreload: true
          stsSeconds: 15552000
          referrerPolicy: no-referrer
          contentSecurityPolicy: "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:; frame-src 'self' https:; media-src 'self' https:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
          customFrameOptionsValue: SAMEORIGIN
          customRequestHeaders:
            X-Forwarded-Proto: https
  ingress-route:
    enabled: true
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    annotations:
      external-dns.alpha.kubernetes.io/target: 192.168.1.200
      kubernetes.io/ingress.class: traefik-external
    spec:
      spec:
        entryPoints:
          - websecure
        routes:
          - match: Host(`lidarr.local.naguiar.dev`) || Host(`lidarr.naguiar.dev`)
            kind: Rule
            middlewares:
              - name: lidarr-default-headers
            services:
              - name: lidarr
                port: *lidarrPort
        tls:
          secretName: certificate-tls
