image:
  repository: jauderho/yt-dlp
  tag: latest
  pullPolicy: IfNotPresent

persistence:
  storageClaimName: standard
  subPath: media

configs:
  baseUrl: "http://localhost:8080"
  schedule: "*/1 * * * *"
  activeDeadlineSeconds: 120
  terminationGracePeriodSeconds: 60
  # Supports either plain strings or objects with optional 'until' date (YYYY-MM-DD):
  # values:
  #   - channel: example_channel
  #     until: "2026-12-31" # Optional final date (runs indefinitely if omitted)
  #   - example_channel_2
  values: []

stash:
  token: ""

