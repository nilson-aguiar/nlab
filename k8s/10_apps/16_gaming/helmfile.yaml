repositories:
  - name: bjw-s
    url: ghcr.io/bjw-s-labs/helm
    oci: true

---
templates:
  bjw: &bjw
    namespace: gaming
    chart: bjw-s/app-template
    version: 5.0.1

releases:
  - name: gaming-storage
    <<: *bjw
    values:
      - ./values/storage.values.yaml

  - name: romm
    <<: *bjw
    needs:
      - gaming/gaming-storage
    values:
      - ./values/romm.values.yaml
    secrets:
      - ./secrets/romm.secrets.yaml
