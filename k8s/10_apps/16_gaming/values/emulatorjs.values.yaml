controllers:
  main:
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/emulatorjs
          tag: 1.9.2
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Amsterdam
          PUID: "1000"
          PGID: "1000"
        ports:
          - name: http
            containerPort: &port 80
          - name: admin
            containerPort: 3000
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  app:
    controller: main
    ports:
      http:
        port: *port
      admin:
        port: 3000

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    advancedMounts:
      main:
        app:
          - path: /config

  data:
    enabled: true
    existingClaim: roms-storage
    advancedMounts:
      main:
        app:
          - path: /data

rawResources:
  ingress-route:
    enabled: true
    manifest:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.1.200
          kubernetes.io/ingress.class: traefik-external
      spec:
        entryPoints:
          - websecure
        routes:
          - match: Host(`play.local.naguiar.dev`) || Host(`play.naguiar.dev`)
            kind: Rule
            services:
              - name: emulatorjs
                port: *port
        tls:
          secretName: certificate-tls
