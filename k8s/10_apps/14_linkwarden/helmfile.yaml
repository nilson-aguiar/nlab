# k8s/10_apps/14_linkwarden/helmfile.yaml
repositories:
  - name: bjw-s
    url: ghcr.io/bjw-s-labs/helm
    oci: true

---
templates:
  bjw: &bjw
    namespace: linkwarden
    chart: bjw-s/app-template
    version: 5.0.1

releases:
  - name: linkwarden
    <<: *bjw
    secrets:
      - ./secrets/linkwarden.secrets.yaml
    values:
      - ./values/linkwarden.values.yaml
