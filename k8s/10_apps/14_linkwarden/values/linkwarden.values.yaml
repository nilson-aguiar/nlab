# k8s/10_apps/14_linkwarden/values/linkwarden.values.yaml
controllers:
  main:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18
        env:
          INIT_POSTGRES_SUPER_PASS:
            valueFrom:
              secretKeyRef:
                name: postgres-superuser
                key: password
          INIT_POSTGRES_HOST: "postgres-rw.cloudnative-pg.svc.cluster.local"
          INIT_POSTGRES_USER: "linkwarden"
          INIT_POSTGRES_DBNAME: "linkwarden"
          INIT_POSTGRES_PASS:
            valueFrom:
              secretKeyRef:
                name: linkwarden
                key: DATABASE_PASSWORD
    containers:
      app:
        image:
          repository: ghcr.io/linkwarden/linkwarden
          tag: v2.16.3
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Amsterdam
          NEXTAUTH_URL: "https://linkwarden.local.naguiar.dev/api/v1/auth"
          DATABASE_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: linkwarden
                key: DATABASE_PASSWORD
          DATABASE_URL: "postgresql://linkwarden:$(DATABASE_PASSWORD)@postgres-rw.cloudnative-pg.svc.cluster.local:5432/linkwarden"
          AUTOSCROLL_TIMEOUT: 60
        envFrom:
          - secretRef:
              name: linkwarden
        ports:
          - name: http
            containerPort: &port 3000
        probes:
          liveness:
            enabled: true
            port: *port
          readiness:
            enabled: true
            port: *port
          startup:
            enabled: true
            port: *port
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi

service:
  app:
    controller: main
    ports:
      http:
        port: *port

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
      - path: /data/data

rawResources:
  ingress-route:
    enabled: true
    manifest:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.1.200
          kubernetes.io/ingress.class: traefik-external
      spec:
        entryPoints:
          - websecure
        routes:
          - match: Host(`linkwarden.local.naguiar.dev`) || Host(`linkwarden.naguiar.dev`)
            kind: Rule
            services:
              - name: linkwarden
                port: *port
        tls:
          secretName: certificate-tls
