{{- if and .Values.qbittorrent.enabled .Values.qbittorrent.vpn.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gluetun-secrets
  labels:
    app: qbittorrent
type: Opaque
stringData:
  WIREGUARD_PRIVATE_KEY: {{ .Values.qbittorrent.vpn.wireguardPrivateKey | quote }}
  WIREGUARD_ADDRESSES: {{ .Values.qbittorrent.vpn.wireguardAddresses | default "10.14.0.2/16" | quote }}
{{- end }}
