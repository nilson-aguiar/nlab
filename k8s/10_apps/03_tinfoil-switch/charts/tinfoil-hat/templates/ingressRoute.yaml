{{- if .Values.ingressRoute.enabled -}}
{{- $svcPort := .Values.service.port -}}
{{- $qbSvcPort := .Values.qbittorrent.service.webui.port -}}
{{- $hostName := .Values.ingressRoute.hostName | default .Release.Namespace -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-ingress-route
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- range .Values.ingressRoute.entryPoints }}
    - {{ . }}
    {{- end }}
  routes:
    {{- if .Values.qbittorrent.enabled }}
    - match: Host(`qb-{{ $hostName }}.{{ .Values.ingressRoute.hostSuffix }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-qbittorrent
          port: {{ $qbSvcPort }}
    {{- end }}
    - match: Host(`{{ $hostName }}.{{ .Values.ingressRoute.hostSuffix }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-tinfoil-hat
          port: {{ $svcPort }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ .Values.ingressRoute.tls.secretName }}
  {{- end }}
{{- end }}