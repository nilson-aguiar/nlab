apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tinfoil-hat
  labels:
    app: tinfoil-hat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinfoil-hat
  template:
    metadata:
      labels:
        app: tinfoil-hat
    spec:
      containers:
        - name: ownfoil
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8465
              name: tinfoil
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OWNFOIL_GAMES_DIR
              value: "/games"
            - name: OWNFOIL_DATA_DIR
              value: "/games/.ownfoil"
            {{- if and .Values.ownfoil .Values.ownfoil.secretKey }}
            - name: OWNFOIL_SECRET_KEY
              value: {{ .Values.ownfoil.secretKey | quote }}
            {{- end }}
            {{- if and .Values.ownfoil .Values.ownfoil.adminPassword }}
            - name: OWNFOIL_ADMIN_PASSWORD
              value: {{ .Values.ownfoil.adminPassword | quote }}
            {{- end }}
          volumeMounts:
            - name: games-storage
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: games-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-tinfoil-hat-pvc
