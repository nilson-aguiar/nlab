apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tinfoil-hat
  labels:
    app: tinfoil-hat
spec:
  replicas: 1
  # Config volume is RWO (Longhorn); avoid two pods fighting over it during rollouts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tinfoil-hat
  template:
    metadata:
      labels:
        app: tinfoil-hat
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: ownfoil
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8465
              name: tinfoil
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OWNFOIL_DATA_DIR
              value: {{ .Values.ownfoil.dataDir | quote }}
          {{- if .Values.ownfoil.admin.name }}
          # Ownfoil creates/updates this admin user on every startup
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-ownfoil-admin
          {{- end }}
          volumeMounts:
            - name: games-storage
              mountPath: {{ .Values.persistence.mountPath }}
            - name: ownfoil-config
              mountPath: /app/config
      volumes:
        - name: games-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-tinfoil-hat-pvc
        - name: ownfoil-config
          {{- if .Values.ownfoil.persistence.config.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ownfoil-config
          {{- else }}
          emptyDir: {}
          {{- end }}
