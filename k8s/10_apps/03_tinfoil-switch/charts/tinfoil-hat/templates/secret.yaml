{{- if .Values.ownfoil.admin.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ownfoil-admin
  labels:
    app: tinfoil-hat
type: Opaque
stringData:
  USER_ADMIN_NAME: {{ .Values.ownfoil.admin.name | quote }}
  USER_ADMIN_PASSWORD: {{ required "ownfoil.admin.password is required" .Values.ownfoil.admin.password | quote }}
{{- end }}
