{{- if .Values.qbittorrent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-qbittorrent
  labels:
    app: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
        {{- if .Values.qbittorrent.vpn.enabled }}
        - name: gluetun
          image: "{{ .Values.qbittorrent.vpn.image.repository }}:{{ .Values.qbittorrent.vpn.image.tag }}"
          env:
            - name: VPN_SERVICE_PROVIDER
              value: {{ .Values.qbittorrent.vpn.provider | quote }}
            - name: VPN_TYPE
              value: {{ .Values.qbittorrent.vpn.type | quote }}
            - name: SERVER_COUNTRIES
              value: {{ .Values.qbittorrent.vpn.country | quote }}
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: {{ .Values.qbittorrent.vpn.firewallOutboundSubnets | default "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24" | quote }}
            - name: FIREWALL_INPUT_PORTS
              value: {{ printf "%v,%v" .Values.qbittorrent.config.webui_port .Values.qbittorrent.config.bittorrent_port | quote }}
            - name: DOT
              value: "off"
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-gluetun-secrets
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
        {{- end }}
        - name: qbittorrent
          image: "{{ .Values.qbittorrent.image.repository }}:{{ .Values.qbittorrent.image.tag }}"
          imagePullPolicy: {{ .Values.qbittorrent.image.pullPolicy }}
          ports:
            - name: webui
              containerPort: {{ .Values.qbittorrent.config.webui_port }}
            - name: bittorrent
              containerPort: {{ .Values.qbittorrent.config.bittorrent_port }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.qbittorrent.config.timezone }}
            - name: WEBUI_PORT
              value: {{ .Values.qbittorrent.config.webui_port | quote }}
            - name: PUID
              value: {{ .Values.qbittorrent.config.puid | quote }}
            - name: PGID
              value: {{ .Values.qbittorrent.config.pgid | quote }}
            - name: UMASK
              value: {{ .Values.qbittorrent.config.umask | quote }}
          volumeMounts:
            - name: games-storage
              mountPath: /downloads
            - name: qbittorrent-config
              mountPath: /config
          resources:
            {{- toYaml .Values.qbittorrent.resources | nindent 12 }}
      volumes:
        {{- if .Values.qbittorrent.vpn.enabled }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        {{- end }}
        - name: games-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-tinfoil-hat-pvc
        - name: qbittorrent-config
          {{- if .Values.qbittorrent.persistence.config.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-qbittorrent-config
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
