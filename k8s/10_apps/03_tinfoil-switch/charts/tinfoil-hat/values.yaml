image:
  repository: a1ex4/ownfoil
  tag: latest
  pullPolicy: IfNotPresent

annotations: {}

service:
  type: ClusterIP
  port: 80
  nodePort: null

resources:
  limits:
    cpu: 400m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

persistence:
  enabled: true
  storageClassName: standard
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /games

ownfoil:
  dataDir: "/games/.ownfoil"
  # Admin user created/updated on startup (USER_ADMIN_NAME / USER_ADMIN_PASSWORD)
  admin:
    name: ""
    password: ""
  persistence:
    config:
      enabled: true
      storageClassName: longhorn
      accessMode: ReadWriteOnce
      size: 1Gi

# values override
ingressRoute:
  annotations: {}
  enabled: false
  hostName: ""
  hostSuffix: example.com
  entryPoints:
    - websecure
  tls:
    enabled: true
    secretName: certificate-tls

qbittorrent:
  enabled: true
  image:
    repository: linuxserver/qbittorrent
    tag: latest
    pullPolicy: IfNotPresent

  service:
    webui:
      port: 8080
      nodePort: null
    bittorrent:
      port: 6881
      nodePort: null

  config:
    timezone: UTC
    webui_port: 8080
    bittorrent_port: 6881
    umask: "022"
    puid: "1000"
    pgid: "1000"

  resources:
    limits:
      cpu: 400m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  persistence:
    config:
      enabled: true
      storageClassName: ""
      size: 100Mi
      accessMode: ReadWriteOnce
