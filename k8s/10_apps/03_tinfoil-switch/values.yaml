qbittorrent:
  image:
    repository: linuxserver/qbittorrent
    tag: 5.2.4

  persistence:
    config:
      storageClassName: "longhorn"

  config:
    timezone: Europe/Amsterdam

service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: "192.168.1.205"

image:
  repository: a1ex4/ownfoil
  tag: 2.4.2

persistence:
  storageClassName: secondary
  accessMode: ReadWriteMany
  size: 100Gi

ownfoil:
  admin:
    name: admin
    # password: set in secrets/tinfoil-hat-secrets.yaml

ingressRoute:
  annotations:
    external-dns.alpha.kubernetes.io/target: 192.168.1.200
    kubernetes.io/ingress.class: traefik-external
  enabled: true
  hostName: tinfoil
  hostSuffix: local.naguiar.dev
  entryPoints:
    - web
    - websecure
