# k8s/10_apps/18_will-be-done/values/will-be-done.values.yaml
controllers:
  main:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/will-be-done/will-be-done
          tag: 0.14.0
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Amsterdam
          PORT: &port 3000
        ports:
          - name: http
            containerPort: *port
        probes:
          liveness:
            enabled: true
            port: *port
          readiness:
            enabled: true
            port: *port
          startup:
            enabled: true
            port: *port
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

service:
  app:
    controller: main
    ports:
      http:
        port: *port

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
    globalMounts:
      - path: /var/lib/will-be-done

rawResources:
  ingress-route:
    enabled: true
    manifest:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.1.200
          kubernetes.io/ingress.class: traefik-external
      spec:
        entryPoints:
          - websecure
        routes:
          - match: Host(`wbd.local.naguiar.dev`) || Host(`wbd.naguiar.dev`)
            kind: Rule
            services:
              - name: will-be-done
                port: *port
        tls:
          secretName: certificate-tls
