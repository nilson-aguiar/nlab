# k8s/10_apps/13_paperless/helmfile.yaml
repositories:
  - name: bjw-s
    url: ghcr.io/bjw-s-labs/helm
    oci: true

---
templates:
  bjw: &bjw
    namespace: paperless
    chart: bjw-s/app-template
    version: 5.0.1

releases:
  - name: paperless
    <<: *bjw
    secrets:
      - ./secrets/paperless.secrets.yaml
    values:
      - ./values/paperless.values.yaml
