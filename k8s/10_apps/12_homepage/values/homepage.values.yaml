# k8s/10_apps/12_homepage/values/homepage.values.yaml
defaultPodOptions:
  automountServiceAccountToken: true

serviceAccount:
  homepage:
    forceRename: homepage

controllers:
  main:
    strategy: Recreate
    serviceAccount:
      identifier: homepage
    containers:
      app:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.8.0
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Amsterdam
          HOMEPAGE_ALLOWED_HOSTS: "home.local.naguiar.dev,home.naguiar.dev,homepage.homepage.svc.cluster.local"
        envFrom:
          - secretRef:
              name: homepage
        ports:
          - name: http
            containerPort: &port 3000
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  app:
    controller: main
    ports:
      http:
        port: *port

configMaps:
  config:
    data:
      settings.yaml: |
        title: Homelab
        favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/homepage.png
        theme: dark
        color: slate
        language: en
        layout:
          Cluster:
            style: row
            columns: 4
          Infrastructure:
            style: row
            columns: 4
          Media & Downloads:
            style: row
            columns: 4
          Productivity & Tools:
            style: row
            columns: 4

      kubernetes.yaml: |
        mode: cluster

      widgets.yaml: |
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: "Cluster"
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true

      bookmarks.yaml: |
        - Homelab Repos:
            - GitHub Repository:
                - abbr: GH
                  href: https://github.com/nilson-aguiar/nlab

      services.yaml: |
        - Infrastructure:
            - ArgoCD:
                icon: argo.png
                href: https://argocd.local.naguiar.dev
                description: GitOps Delivery Engine

            - Pi-hole:
                icon: pi-hole.png
                href: https://pihole.local.naguiar.dev
                description: Network Ad-blocking DNS

            - Grafana:
                icon: grafana.png
                href: https://grafana.local.naguiar.dev
                description: Metrics & Observability Dashboards

            - VictoriaMetrics:
                icon: victoriametrics.png
                href: https://vmsingle.local.naguiar.dev
                description: Time-series Monitoring Stack

            - Traefik:
                icon: traefik.png
                href: https://traefik.local.naguiar.dev
                description: Ingress Controller

        - Media & Downloads:
            - Sonarr:
                icon: sonarr.png
                href: https://sonarr.local.naguiar.dev
                description: TV Series Management

            - Radarr:
                icon: radarr.png
                href: https://radarr.local.naguiar.dev
                description: Movies Management

            - qBittorrent:
                icon: qbittorrent.png
                href: https://media-qb.local.naguiar.dev
                description: Torrent Downloader

            - Jellyfin:
                icon: jellyfin.png
                href: https://jellyfin.local.naguiar.dev
                description: Media Streaming Server

            - Plex:
                icon: plex.png
                href: https://plex.local.naguiar.dev
                description: Media Server

            - Prowlarr:
                icon: prowlarr.png
                href: https://prowlarr.local.naguiar.dev
                description: Indexer Manager

            - Overseerr:
                icon: overseerr.png
                href: https://seerr.local.naguiar.dev
                description: Media Requests & Discovery

            - Tautulli:
                icon: tautulli.png
                href: https://tautulli.local.naguiar.dev
                description: Plex Monitoring & Analytics

        - Productivity & Tools:
            - Home Assistant:
                icon: home-assistant.png
                href: https://ha.local.naguiar.dev
                description: Smart Home Automation

            - Actual Budget:
                icon: actual.png
                href: https://actual.local.naguiar.dev
                description: Zero-based Personal Finance

            - Paperless-ngx:
                icon: paperless-ngx.png
                href: https://paperless.local.naguiar.dev
                description: Document Archive & OCR

            - Vaultwarden:
                icon: vaultwarden.png
                href: https://vaultwarden.local.naguiar.dev
                description: Password Manager

            - AFFiNE:
                icon: affine.png
                href: https://affine.local.naguiar.dev
                description: Knowledge Base & Notes

            - Komga:
                icon: komga.png
                href: https://komga.local.naguiar.dev
                description: Comics & Manga Server

            - Linkwarden:
                icon: linkwarden.png
                href: https://linkwarden.local.naguiar.dev
                description: Bookmark Manager

            - IT-Tools:
                icon: it-tools.png
                href: https://it-tools.local.naguiar.dev
                description: Developer Utilities

      custom.js: |
        (function () {
          // Detect if accessed from external domain
          const isExternal = window.location.hostname === 'home.naguiar.dev';
          if (!isExternal) return;

          // Services strictly confined to LAN (no public IngressRoute on *.naguiar.dev)
          const lanOnlySubdomains = [
            'argocd',
            'pihole',
            'vmsingle',
            'victoriametrics',
            'traefik',
            'media-qb',
            'qb',
            'plex',
            'jellyfin',
            'prowlarr',
            'stash'
          ];

          function adaptContext() {
            const links = document.querySelectorAll('a[href*=".local.naguiar.dev"]');
            links.forEach(a => {
              try {
                const url = new URL(a.href);
                const subdomain = url.hostname.split('.')[0];

                if (lanOnlySubdomains.includes(subdomain)) {
                  // Hide LAN-only cards when accessed externally
                  const card = a.closest('.service-card') || a.closest('.group') || a.parentElement;
                  if (card && card.style.display !== 'none') {
                    card.style.display = 'none';
                  }
                } else {
                  // Rewrite local domain to public domain
                  const newHref = a.href.replace('.local.naguiar.dev', '.naguiar.dev');
                  if (a.href !== newHref) {
                    a.href = newHref;
                  }
                }
              } catch (e) {
                // Ignore parse errors
              }
            });
          }

          // Initial execution
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', adaptContext);
          } else {
            adaptContext();
          }

          window.addEventListener('load', adaptContext);

          // Handle client-side dynamic DOM updates
          const observer = new MutationObserver(() => {
            adaptContext();
          });

          observer.observe(document.documentElement, {
            childList: true,
            subtree: true
          });

          // Fallback timers during initial React hydration
          [100, 300, 600, 1200, 2500].forEach(delay => setTimeout(adaptContext, delay));
        })();

persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /app/config/settings.yaml
        subPath: settings.yaml
      - path: /app/config/services.yaml
        subPath: services.yaml
      - path: /app/config/widgets.yaml
        subPath: widgets.yaml
      - path: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml
      - path: /app/config/kubernetes.yaml
        subPath: kubernetes.yaml
      - path: /app/config/custom.js
        subPath: custom.js
  logs:
    type: emptyDir
    globalMounts:
      - path: /app/config/logs

rawResources:
  ingress-route:
    enabled: true
    manifest:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.1.200
          kubernetes.io/ingress.class: traefik-external
      spec:
        entryPoints:
          - websecure
        routes:
          - match: Host(`home.local.naguiar.dev`) || Host(`home.naguiar.dev`)
            kind: Rule
            services:
              - name: homepage
                port: *port
        tls:
          secretName: certificate-tls
  cluster-role:
    enabled: true
    forceRename: homepage
    manifest:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      rules:
        - apiGroups: [""]
          resources: ["namespaces", "pods", "nodes"]
          verbs: ["get", "list"]
        - apiGroups: ["networking.k8s.io", "extensions"]
          resources: ["ingresses"]
          verbs: ["get", "list"]
        - apiGroups: ["traefik.io"]
          resources: ["ingressroutes"]
          verbs: ["get", "list"]
        - apiGroups: ["metrics.k8s.io"]
          resources: ["nodes", "pods"]
          verbs: ["get", "list"]
  cluster-role-binding:
    enabled: true
    forceRename: homepage
    manifest:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: homepage
      subjects:
        - kind: ServiceAccount
          name: homepage
          namespace: homepage
