# k8s/10_apps/12_homepage/helmfile.yaml
repositories:
  - name: bjw-s
    url: ghcr.io/bjw-s-labs/helm
    oci: true

---
templates:
  bjw: &bjw
    namespace: homepage
    chart: bjw-s/app-template
    version: 5.0.1

releases:
  - name: homepage
    <<: *bjw
    secrets:
      - ./secrets/homepage.secrets.yaml
    values:
      - ./values/homepage.values.yaml
