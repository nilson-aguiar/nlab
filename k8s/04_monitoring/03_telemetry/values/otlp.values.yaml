# Default values for opentelemetry-collector.

image:
  # If you want to use the core image `otel/opentelemetry-collector`, you also need to change `command.name` value to `otelcol`.
  repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # When digest is set to a non-empty value, images will be pulled by digest (regardless of tag value).
  digest: ""
imagePullSecrets: []

# OpenTelemetry Collector executable
command:
  name: "otelcol-k8s"
  extraArgs: []

# Valid values are "daemonset", "deployment", and "statefulset".
mode: "daemonset"

presets:
  # Collect logs from /var/log/pods on each node
  logsCollection:
    enabled: true
    storeCheckpoints: true
  # Extract kubernetes metadata (pod, namespace, container)
  kubernetesAttributes:
    enabled: true

# When enabled, the chart will set the GOMEMLIMIT env var to 80% of the configured resources.limits.memory.
useGOMEMLIMIT: true

# Resource limits & requests
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

service:
  # Enable the creation of a Service.
  # By default, it's enabled on mode != daemonset.
  # However, to enable it on mode = daemonset, its creation must be explicitly enabled
  enabled: true
  type: ClusterIP
  trafficDistribution: PreferClose
  externalTrafficPolicy: Cluster

ingress:
  enabled: false

rollout:
  rollingUpdate: {}
  # When 'mode: daemonset', maxSurge cannot be used when hostPort is set for any of the ports
  # maxSurge: 25%
  # maxUnavailable: 0
  strategy: RollingUpdate

config:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}
  processors:
    filter/noisy:
      error_mode: ignore
      traces:
        span:
          - 'attributes["http.route"] == "/ping" or attributes["http.route"] == "/healthz" or attributes["http.route"] == "/readyz"'
      logs:
        log_record:
          - 'IsMatch(body, ".*(ping|healthz|readyz|metrics).*")'
          - 'IsMatch(body, ".*config::axum::middlewares::access_log.*POST /api/default/v1/.*")'
    transform:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - 'merge_maps(attributes, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\s*\\{")'
            - 'set(severity_text, "INFO") where IsMatch(body, "(?i)(level=info|\"level\":\"info\"|\\sINFO\\s)")'
            - 'set(severity_text, "WARN") where IsMatch(body, "(?i)(level=warn|\"level\":\"warn\"|\\sWARN\\s)")'
            - 'set(severity_text, "ERROR") where IsMatch(body, "(?i)(level=error|\"level\":\"error\"|\\sERROR\\s)")'
            - 'set(severity_text, "DEBUG") where IsMatch(body, "(?i)(level=debug|\"level\":\"debug\"|\\sDEBUG\\s)")'
  exporters:
    otlphttp/openobserve:
      endpoint: http://open-observe.monitoring.svc.cluster.local:5080/api/default
      headers:
        stream-name: k8s
      tls:
        insecure: true
    otlphttp/victoriametrics:
      endpoint: http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/opentelemetry
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [k8s_attributes, filter/noisy, memory_limiter, batch]
        exporters: [otlphttp/openobserve]
      metrics:
        receivers: [otlp]
        processors: [k8s_attributes, memory_limiter, batch]
        exporters: [otlphttp/openobserve, otlphttp/victoriametrics]
      logs:
        receivers: [otlp, file_log]
        processors: [k8s_attributes, filter/noisy, transform, memory_limiter, batch]
        exporters: [otlphttp/openobserve]
